<p-toast></p-toast>

<div class="p-grid p-justify-center">
  <div class="p-col-12 p-md-6">
    <p-card>
      <ng-template pTemplate="title">Nuevo Tratamiento</ng-template>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="p-fluid p-formgrid p-grid">
          <div class="p-field p-col-12">
            <label for="treatmentName">Nombre</label>
            <input id="treatmentName" pInputText formControlName="treatmentName" />
          </div>

          <div class="p-field p-col-12">
            <label for="treatmentDescription">Descripción</label>
            <textarea id="treatmentDescription" rows="3" pInputText formControlName="treatmentDescription"></textarea>
          </div>

          <div class="p-field p-col-12">
            <label for="treatmentCost">Costo</label>
            <input id="treatmentCost" type="number" pInputText formControlName="treatmentCost" />
          </div>
        </div>

        <div class="p-d-flex p-jc-end">
          <p-button label="Cancelar" class="p-button-text" (click)="cancel()"></p-button>
          <p-button label="Guardar" type="submit" [loading]="saving" class="p-ml-2"></p-button>
        </div>
      </form>
    </p-card>
  </div>
</div>
