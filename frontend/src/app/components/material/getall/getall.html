<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="p-grid p-justify-between p-align-center p-mb-3">
  <div class="p-col"><h2>Materiales</h2></div>
  <div class="p-col-fixed">
    <p-button
      label="Nuevo"
      icon="pi pi-plus"
      routerLink="/materials/new"
      styleClass="p-button-success"
    ></p-button>
  </div>
</div>

<p-table
  [value]="materials"
  [loading]="loading"
  [paginator]="true"
  [rows]="10"
  [rowsPerPageOptions]="[10,25,50]"
  styleClass="p-datatable-striped"
>
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="id">ID <p-sortIcon field="id"></p-sortIcon></th>
      <th pSortableColumn="materialName">Nombre <p-sortIcon field="materialName"></p-sortIcon></th>
      <th pSortableColumn="materialDescription">
        Descripción <p-sortIcon field="materialDescription"></p-sortIcon>
      </th>
      <th pSortableColumn="materialStock">Stock <p-sortIcon field="materialStock"></p-sortIcon></th>
      <th style="width: 10rem">Acciones</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-m>
    <tr>
      <td>{{ m.id }}</td>
      <td>{{ m.materialName || '-' }}</td>
      <td>{{ m.materialDescription || '-' }}</td>
      <td>{{ m.materialStock }}</td>
      <td>
        <div class="p-button-group">
          <p-button
            icon="pi pi-pencil"
            pTooltip="Editar"
            tooltipPosition="top"
            styleClass="p-button-rounded p-button-info p-mr-1"
            [routerLink]="['/materials/edit', m.id]"
          ></p-button>
          <p-button
            icon="pi pi-trash"
            pTooltip="Eliminar"
            tooltipPosition="top"
            styleClass="p-button-rounded p-button-danger"
            (click)="confirmDelete(m)"
          ></p-button>
        </div>
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="5">No hay materiales registrados</td>
    </tr>
  </ng-template>
</p-table>
