<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="p-grid p-justify-between p-align-center p-mb-3">
	<div class="p-col"><h2>Historias Dentales</h2></div>
	<div class="p-col-fixed">
		<p-button label="Nueva Historia" icon="pi pi-plus" routerLink="/dental-histories/new" styleClass="p-button-success"></p-button>
	</div>
</div>

<p-table [value]="histories" [loading]="loading" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[10,25,50]">
	<ng-template pTemplate="header">
		<tr>
			<th>ID</th>
			<th>Paciente (ID)</th>
			<th>Anamnesis</th>
			<th style="width:10rem">Acciones</th>
		</tr>
	</ng-template>

	<ng-template pTemplate="body" let-h>
		<tr>
			<td>{{ h.id }}</td>
			<td>{{ h.historyPatient }}</td>
			<td>{{ h.historyAnamnesis || '-' }}</td>
			<td>
				<div class="p-button-group">
					<p-button icon="pi pi-pencil" pTooltip="Editar" tooltipPosition="top" styleClass="p-button-rounded p-button-info p-mr-1" [routerLink]="['/dental-histories/edit', h.id]"></p-button>
					<p-button icon="pi pi-trash" pTooltip="Eliminar" tooltipPosition="top" styleClass="p-button-rounded p-button-danger" (click)="confirmDelete(h)"></p-button>
				</div>
			</td>
		</tr>
	</ng-template>

	<ng-template pTemplate="emptymessage">
		<tr>
			<td colspan="4">No hay historias</td>
		</tr>
	</ng-template>
</p-table>
