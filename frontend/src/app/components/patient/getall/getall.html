<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="p-grid p-justify-between p-align-center p-mb-3">
  <div class="p-col"><h2>Pacientes</h2></div>
  <div class="p-col-fixed">
    <p-button
      label="Nuevo Paciente"
      icon="pi pi-plus"
      routerLink="/patients/new"
      styleClass="p-button-success"
    ></p-button>
  </div>
</div>

<p-table
  [value]="patients"
  [loading]="loading"
  [paginator]="true"
  [rows]="10"
  [rowsPerPageOptions]="[10,25,50]"
  styleClass="p-datatable-striped"
>
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="id">ID <p-sortIcon field="id"></p-sortIcon></th>
      <th pSortableColumn="patientName">Nombre <p-sortIcon field="patientName"></p-sortIcon></th>
      <th pSortableColumn="patientLastName">
        Apellido <p-sortIcon field="patientLastName"></p-sortIcon>
      </th>
      <th pSortableColumn="patientBirthDate">
        Nacimiento <p-sortIcon field="patientBirthDate"></p-sortIcon>
      </th>
      <th pSortableColumn="patientPhone">
        Teléfono <p-sortIcon field="patientPhone"></p-sortIcon>
      </th>
      <th style="width: 10rem">Acciones</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-p>
    <tr>
      <td>{{ p.id }}</td>
      <td>{{ p.patientName }}</td>
      <td>{{ p.patientLastName }}</td>
      <td>{{ p.patientBirthDate || '-' }}</td>
      <td>{{ p.patientPhone || '-' }}</td>
      <td>
        <div class="p-button-group">
          <p-button
            icon="pi pi-pencil"
            pTooltip="Editar"
            tooltipPosition="top"
            styleClass="p-button-rounded p-button-info p-mr-1"
            [routerLink]="['/patients/edit', p.id]"
          ></p-button>
          <p-button
            icon="pi pi-trash"
            pTooltip="Eliminar"
            tooltipPosition="top"
            styleClass="p-button-rounded p-button-danger"
            (click)="confirmDelete(p)"
          ></p-button>
        </div>
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="6">No hay pacientes registrados</td>
    </tr>
  </ng-template>
</p-table>
