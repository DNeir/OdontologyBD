<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="p-grid p-justify-between p-align-center">
  <div class="p-col"><h2>Dientes</h2></div>
  <div class="p-col-fixed">
    <p-button
      label="Nuevo"
      icon="pi pi-plus"
      routerLink="/teeth/new"
      styleClass="p-button-success"
    ></p-button>
  </div>
</div>

<p-table
  [value]="teeth"
  [loading]="loading"
  [paginator]="true"
  [rows]="10"
  [rowsPerPageOptions]="[10,25,50]"
  styleClass="p-datatable-striped"
>
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="id">ID<p-sortIcon field="id"></p-sortIcon></th>
      <th pSortableColumn="toothNumber">Número<p-sortIcon field="toothNumber"></p-sortIcon></th>
      <th pSortableColumn="toothDescription">
        Descripción<p-sortIcon field="toothDescription"></p-sortIcon>
      </th>
      <th style="width: 10rem">Acciones</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-t>
    <tr>
      <td>{{ t.id }}</td>
      <td>{{ t.toothNumber }}</td>
      <td>{{ t.toothDescription || '-' }}</td>
      <td>
        <span class="p-button-group">
          <p-button
            icon="pi pi-pencil"
            pTooltip="Editar"
            tooltipPosition="top"
            styleClass="p-button-rounded p-button-info p-mr-1"
            [routerLink]="['/teeth/edit', t.id]"
          ></p-button>
          <p-button
            icon="pi pi-trash"
            pTooltip="Eliminar"
            tooltipPosition="top"
            styleClass="p-button-rounded p-button-danger"
            (click)="confirmDelete(t)"
          ></p-button>
        </span>
      </td>
    </tr>
  </ng-template>
  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="4">Sin registros</td>
    </tr>
  </ng-template>
</p-table>
