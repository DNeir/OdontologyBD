<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="p-grid p-justify-between p-align-center p-mb-3">
	<div class="p-col"><h2>Pagos</h2></div>
	<div class="p-col-fixed">
		<p-button label="Nuevo" icon="pi pi-plus" routerLink="/payments/new" styleClass="p-button-success"></p-button>
	</div>
</div>

<p-table [value]="payments" [loading]="loading" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[10,25,50]">
	<ng-template pTemplate="header">
		<tr>
			<th>ID</th>
			<th>Plan ID</th>
			<th>Fecha</th>
			<th>Monto</th>
			<th>Método</th>
			<th style="width:10rem">Acciones</th>
		</tr>
	</ng-template>

	<ng-template pTemplate="body" let-p>
		<tr>
			<td>{{ p.id }}</td>
			<td>{{ p.paymentPlan }}</td>
			<td>{{ p.paymentDateTime || '-' }}</td>
			<td>{{ p.paymentAmount }}</td>
			<td>{{ p.paymentMethod || '-' }}</td>
			<td>
				<div class="p-button-group">
					<p-button icon="pi pi-pencil" pTooltip="Editar" tooltipPosition="top" styleClass="p-button-rounded p-button-info p-mr-1" [routerLink]="['/payments/edit', p.id]"></p-button>
					<p-button icon="pi pi-trash" pTooltip="Eliminar" tooltipPosition="top" styleClass="p-button-rounded p-button-danger" (click)="confirmDelete(p)"></p-button>
				</div>
			</td>
		</tr>
	</ng-template>

	<ng-template pTemplate="emptymessage">
		<tr>
			<td colspan="6">No hay pagos</td>
		</tr>
	</ng-template>
</p-table>
