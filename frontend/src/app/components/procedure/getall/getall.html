<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="p-grid p-justify-between p-align-center">
  <div class="p-col"><h2>Procedimientos</h2></div>
  <div class="p-col-fixed">
    <p-button
      label="Nuevo"
      icon="pi pi-plus"
      routerLink="/procedures/new"
      styleClass="p-button-success"
    ></p-button>
  </div>
</div>

<p-table
  [value]="procedures"
  [loading]="loading"
  [paginator]="true"
  [rows]="10"
  [rowsPerPageOptions]="[10,25,50]"
  styleClass="p-datatable-striped"
>
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="id">ID<p-sortIcon field="id"></p-sortIcon></th>
      <th pSortableColumn="procedurePlan">
        Plan ID<p-sortIcon field="procedurePlan"></p-sortIcon>
      </th>
      <th pSortableColumn="procedureTreatment">
        Tratamiento ID<p-sortIcon field="procedureTreatment"></p-sortIcon>
      </th>
      <th pSortableColumn="procedureDate">Fecha<p-sortIcon field="procedureDate"></p-sortIcon></th>
      <th style="width: 10rem">Acciones</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-p>
    <tr>
      <td>{{ p.id }}</td>
      <td>{{ p.procedurePlan }}</td>
      <td>{{ p.procedureTreatment }}</td>
      <td>{{ p.procedureDate | date:'short' }}</td>
      <td>
        <span class="p-button-group">
          <p-button
            icon="pi pi-pencil"
            pTooltip="Editar"
            tooltipPosition="top"
            styleClass="p-button-rounded p-button-info p-mr-1"
            [routerLink]="['/procedures/edit', p.id]"
          ></p-button>
          <p-button
            icon="pi pi-trash"
            pTooltip="Eliminar"
            tooltipPosition="top"
            styleClass="p-button-rounded p-button-danger"
            (click)="confirmDelete(p)"
          ></p-button>
        </span>
      </td>
    </tr>
  </ng-template>
  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="5">Sin registros</td>
    </tr>
  </ng-template>
</p-table>
