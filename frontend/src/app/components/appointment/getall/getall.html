<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="p-grid p-justify-between p-align-center p-mb-3">
	<div class="p-col"><h2>Citas</h2></div>
	<div class="p-col-fixed">
		<p-button label="Nueva Cita" icon="pi pi-plus" routerLink="/appointments/new" styleClass="p-button-success"></p-button>
	</div>
</div>

<p-table [value]="appointments" [loading]="loading" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[10,25,50]">
	<ng-template pTemplate="header">
		<tr>
			<th>ID</th>
			<th>Paciente</th>
			<th>Dentista</th>
			<th>Fecha</th>
			<th>Motivo</th>
			<th style="width:10rem">Acciones</th>
		</tr>
	</ng-template>

	<ng-template pTemplate="body" let-a>
		<tr>
			<td>{{ a.id }}</td>
			<td>{{ a.appointmentPatient }}</td>
			<td>{{ a.appointmentDentist }}</td>
			<td>{{ a.appointmentDateTime }}</td>
			<td>{{ a.appointmentReason || '-' }}</td>
			<td>
				<div class="p-button-group">
					<p-button icon="pi pi-pencil" pTooltip="Editar" tooltipPosition="top" styleClass="p-button-rounded p-button-info p-mr-1" [routerLink]="['/appointments/edit', a.id]"></p-button>
					<p-button icon="pi pi-trash" pTooltip="Eliminar" tooltipPosition="top" styleClass="p-button-rounded p-button-danger" (click)="confirmDelete(a)"></p-button>
				</div>
			</td>
		</tr>
	</ng-template>

	<ng-template pTemplate="emptymessage">
		<tr>
			<td colspan="6">No hay citas</td>
		</tr>
	</ng-template>
</p-table>
