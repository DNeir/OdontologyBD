<p-toast></p-toast>

<div class="p-grid p-justify-between p-align-center">
  <div class="p-col">
    <h2>Crear Dentista</h2>
    <p class="muted">Complete los datos del dentista y presione Guardar.</p>
  </div>
  <div class="p-col-fixed">
    <p-button
      label="Volver"
      icon="pi pi-arrow-left"
      routerLink="/dentists"
      styleClass="p-button-secondary"
    ></p-button>
  </div>
</div>

<p-card class="p-mt-3">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-fluid">
    <div class="p-grid p-align-center">
      <div class="p-col-12 p-md-6">
        <label for="dentistName">Nombre <span class="required">*</span></label>
        <input
          id="dentistName"
          pInputText
          formControlName="dentistName"
          placeholder="Ingrese nombre"
        />
        <small
          *ngIf="form.get('dentistName')?.invalid && form.get('dentistName')?.touched"
          class="p-error"
          >Nombre requerido</small
        >
      </div>

      <div class="p-col-12 p-md-6">
        <label for="dentistLastName">Apellido <span class="required">*</span></label>
        <input
          id="dentistLastName"
          pInputText
          formControlName="dentistLastName"
          placeholder="Ingrese apellido"
        />
        <small
          *ngIf="form.get('dentistLastName')?.invalid && form.get('dentistLastName')?.touched"
          class="p-error"
          >Apellido requerido</small
        >
      </div>

      <div class="p-col-12">
        <label for="dentistSpecialty">Especialidad</label>
        <input
          id="dentistSpecialty"
          pInputText
          formControlName="dentistSpecialty"
          placeholder="Ej. Ortodoncia, Endodoncia (opcional)"
        />
      </div>

      <div class="p-col-12 p-text-right">
        <p-button
          label="Guardar"
          icon="pi pi-save"
          type="submit"
          styleClass="p-button-success"
          [disabled]="form.invalid || saving"
        ></p-button>
        <p-button
          label="Cancelar"
          icon="pi pi-times"
          routerLink="/dentists"
          styleClass="p-button-secondary p-ml-2"
        ></p-button>
      </div>
    </div>
  </form>
</p-card>
