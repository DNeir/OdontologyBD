<p-toast></p-toast>

<div class="p-grid p-justify-between p-align-center p-mb-3">
  <div class="p-col">
    <h2>Editar Dentista</h2>
  </div>
  <div class="p-col-fixed">
    <p-button
      label="Volver"
      icon="pi pi-arrow-left"
      styleClass="p-button-secondary"
      routerLink="/dentists"
    ></p-button>
  </div>
</div>

<div class="p-card p-shadow-2 p-p-4" style="max-width: 900px; margin: auto">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-fluid">
    <div class="p-grid">
      <div class="p-col-12 p-md-6">
        <label for="dentistName">Nombre</label>
        <input
          id="dentistName"
          type="text"
          class="p-inputtext p-component w-full"
          formControlName="dentistName"
          placeholder="Ingrese el nombre"
        />
        <small
          *ngIf="form.get('dentistName')?.invalid && form.get('dentistName')?.touched"
          class="p-error"
        >
          Nombre es requerido
        </small>
      </div>

      <div class="p-col-12 p-md-6">
        <label for="dentistLastName">Apellido</label>
        <input
          id="dentistLastName"
          type="text"
          class="p-inputtext p-component w-full"
          formControlName="dentistLastName"
          placeholder="Ingrese el apellido"
        />
        <small
          *ngIf="form.get('dentistLastName')?.invalid && form.get('dentistLastName')?.touched"
          class="p-error"
        >
          Apellido es requerido
        </small>
      </div>

      <div class="p-col-12">
        <label for="dentistSpecialty">Especialidad</label>
        <input
          id="dentistSpecialty"
          type="text"
          class="p-inputtext p-component w-full"
          formControlName="dentistSpecialty"
          placeholder="Especialidad (opcional)"
        />
      </div>
    </div>

    <div class="p-grid p-justify-end p-mt-4">
      <div class="p-col-fixed">
        <p-button
          label="Cancelar"
          icon="pi pi-times"
          styleClass="p-button-secondary p-mr-2"
          routerLink="/dentists"
          type="button"
        ></p-button>
      </div>
      <div class="p-col-fixed">
        <p-button
          label="Guardar"
          icon="pi pi-save"
          styleClass="p-button-success"
          [disabled]="form.invalid || loading"
          type="submit"
        ></p-button>
      </div>
    </div>
  </form>
</div>
